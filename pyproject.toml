[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cred-scan"
version = "0.1.0"
description = "Credential scanner design schemas and interface sketches"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dspy==3.2.1",
    "pathspec>=0.12,<1",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.15,<3",
    "pyyaml>=6.0,<7",
    "python-dotenv>=1.0,<2",
    "httpx>=0.27,<1",
    "typer>=0.16,<1",
    "aiofiles>=25,<26",
]

[project.scripts]
cred-scan = "cred_scan.cli:app"

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.11,<1",
    "ty>=0.0.1",
]

[tool.pytest.ini_options]
addopts = "--strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
src = ["src"]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "PLC0415", "UP006"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["cred_scan*"]

[tool.uv]
package = true
