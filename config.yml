# Artifactory-Docker-first runtime configuration.
# Relative paths resolve against this file.
workspace:
  workspace-dir: ./workspace


titus:
  executable: ./titus
  arguments:
    - --extract
    - all
    - --extract-max-size
    - 100MB
    - --max-file-size
    - "524288"
  internal_workers: 1

judge:
  provider: azure
  model: gpt-5.6-luna
  base_url: https://cytct.services.ai.azure.com/openai/v1
  api_version: null
  max_iterations: 10
  layer_tools:
    enabled: true

exclusions:
  paths: path-exclusions.list
  credentials: cred-value-exclusions.list

backends:
  - name: artifactory_docker
    base_url: https://rb-artifactory.bosch.com/artifactory
    platform: linux/amd64
